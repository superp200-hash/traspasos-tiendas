<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traspasos - prueba</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #00000012}
h1{margin:0 0 6px;font-size:25px}.muted{color:#667085}.clock{font-size:19px;font-weight:700;margin:12px 0 18px}
h2{font-size:15px;margin:16px 0 9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
button{min-height:48px;border-radius:12px;border:1px solid #cfd5dc;background:#fff;font-weight:700;font-size:14px;padding:8px;cursor:pointer}
button.selected{background:#18212b;color:#fff;border-color:#18212b}
.result{border-radius:14px;background:#f7f8fa;padding:15px;margin-top:15px}.big{font-size:25px;font-weight:800;margin:5px 0 12px}
.warn{margin-top:12px;padding:12px;border-left:4px solid #e59b00;background:#fff5df;border-radius:8px}
.error{margin-top:12px;padding:12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px}
.testgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.test{font-size:13px;text-align:left}
@media(max-width:430px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.testgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>📦 Consulta de traspasos</h1>
<div class="muted">Prueba: dos clics, origen → destino.</div>
<div class="clock">Hora actual: <span id="clock"></span></div>

<h2>ORIGEN</h2><div id="orig" class="grid"></div>
<h2>DESTINO</h2><div id="dest" class="grid"></div>
<div id="result"></div>
</section>

<section class="card">
<h2 style="margin-top:0">🧪 Pruebas rápidas</h2>
<div class="muted" style="margin-bottom:10px">Toca una para cargarla automáticamente.</div>
<div id="tests" class="testgrid"></div>
</section>
</main>

<script>
const STORES=["ALICANTE","ALICANTE NORTE","ELCHE CARRUS","ATALAYAS","IBI","ALCOY","ORIHUELA"];

const ROUTES=[
 {name:"R01",from:"ALICANTE",to:"ALICANTE NORTE",
  rows:[["08:05","08:45","09:30"],["11:20","11:50","11:00"],["15:30","16:00","13:50"]]},
 {name:"R04",from:"ELCHE CARRUS",to:"ATALAYAS",
  rows:[["07:30","09:30","19:15"],["10:55","12:30","10:45"],["14:35","16:40","14:00"]]},
 {name:"R08",from:"IBI",to:"ALCOY",
  rows:[["08:00","08:50","19:20"],["14:45","15:45","13:15"]]}
];

let origin="", destination="";

function mins(s){const [h,m]=s.split(":").map(Number);return h*60+m}
function fmt(n){n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function now(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function tick(){const d=new Date();document.querySelector("#clock").textContent=
 String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function makeButtons(id,which){
 const box=document.querySelector(id);
 STORES.forEach(s=>{
   const b=document.createElement("button");b.textContent=s;
   b.addEventListener("click",()=>{
     if(which==="o")origin=s;else destination=s;
     box.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));
     b.classList.add("selected");
     if(origin&&destination)calculate();
   });
   box.appendChild(b);
 });
}
function mark(){
 document.querySelectorAll("#orig button").forEach(b=>b.classList.toggle("selected",b.textContent===origin));
 document.querySelectorAll("#dest button").forEach(b=>b.classList.toggle("selected",b.textContent===destination));
}
function calculate(){
 const n=now(), out=document.querySelector("#result");
 if(origin===destination){out.innerHTML='<div class="result"><div class="big">Mismo almacén</div></div>';return}
 let best=null;
 for(const r of ROUTES){
   if(r.from!==origin||r.to!==destination)continue;
   for(const row of r.rows){
     const dep=mins(row[0]), arr=mins(row[1]), cut=mins(row[2]);
     // For this prototype, an expedition is valid only if the current time
     // has not passed the green order cutoff and the vehicle has not departed.
     if(n<=cut && n<=dep){best={r,dep,arr,cut};break}
   }
   if(best)break;
 }
 if(!best){
   out.innerHTML='<div class="result"><div class="big">🔴 No hay salida válida ahora</div>'+
    '<div>La salida puede haberse descartado por hora límite, o esta combinación todavía no está cargada en la prueba.</div>'+
    '<div class="warn">⚠️ <b>No olvides terminar el traspaso interno.</b></div></div>';
   return;
 }
 out.innerHTML='<div class="result">'+
   '<div class="big">🟢 Llega hoy a las '+fmt(best.arr)+'</div>'+
   '<b>'+origin+' → '+destination+'</b><br>'+
   'Ruta '+best.r.name+' · salida '+fmt(best.dep)+' · llegada '+fmt(best.arr)+'<br>'+
   '<span class="muted">Consulta: '+fmt(n)+' · H. pedido: '+fmt(best.cut)+'</span>'+
   '<div class="warn">⚠️ <b>No olvides terminar el traspaso interno.</b></div>'+
   '</div>';
}

const testCases=[
 ["ALICANTE","ALICANTE NORTE","Ruta directa"],
 ["ELCHE CARRUS","ATALAYAS","Ruta directa"],
 ["IBI","ALCOY","Ruta directa"],
 ["ALICANTE","ORIHUELA","Sin ruta cargada todavía"]
];
const tbox=document.querySelector("#tests");
testCases.forEach(t=>{
 const b=document.createElement("button");b.className="test";
 b.innerHTML="<b>"+t[0]+" → "+t[1]+"</b><br><span class='muted'>"+t[2]+"</span>";
 b.addEventListener("click",()=>{origin=t[0];destination=t[1];mark();calculate()});
 tbox.appendChild(b);
});

makeButtons("#orig","o");makeButtons("#dest","d");tick();setInterval(tick,1000);
</script>
</body>
</html>
