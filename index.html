<!doctype html>
<html lang="es">
<head>

<title>TRASPASOS TIENDA V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{width:100%;max-width:none;margin:auto;padding:10px 12px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h1{margin:0 0 5px;font-size:25px}.muted{color:#667085}.clock{font-size:18px;font-weight:700;margin:12px 0}
.pickers{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:10px;align-items:start;width:100%}.arrow{font-size:34px;font-weight:800;text-align:center;margin-top:60px}
h2{font-size:14px;margin:8px 0 9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
button{min-height:48px;border-radius:11px;border:1px solid #d0d5dd;background:#fff;font-weight:700;padding:8px;cursor:pointer}
button.selected{background:#17202a;color:#fff;border-color:#17202a}
.result{margin-top:16px;padding:15px;border-radius:14px;background:#f7f8fa}.big{font-size:25px;font-weight:800;margin-bottom:10px}
.warn{margin-top:12px;padding:12px;border-left:4px solid #f59e0b;background:#fff5df;border-radius:8px}.error{margin-top:12px;padding:12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px}
.steps{margin-top:10px}.step{padding:9px 0;border-bottom:1px solid #e7e9ec}.step:last-child{border:0}
.chain{font-weight:800;font-size:17px;line-height:1.5}.meta{font-size:14px;color:#667085;margin-top:4px}.incident{margin-top:10px;padding:10px 12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px;font-size:14px}
.small{font-size:13px;color:#667085}
@media(max-width:900px){main{padding:8px}.grid{gap:6px}}
@media(max-width:650px){.pickers{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.trip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}.trip .lbl{display:block;font-size:12px;color:#667085;font-weight:700}.trip .val{display:block;font-size:22px;font-weight:800}
.step.ok,.step.past{border-radius:10px;padding:10px 12px;margin-top:8px;border:0;border-left:5px solid}.step.ok{background:#e7f6ec;border-left-color:#16a34a}.step.past{background:#fdecea;border-left-color:#d92d20}.step.past .val{color:#b42318}.step.ok .val{color:#166534}.tag{float:right;font-size:12px;font-weight:800}.step.ok .tag{color:#166534}.step.past .tag{color:#b42318}
.step.first{background:#d1fae5;box-shadow:0 0 0 2px #16a34a}.step.first .tag{font-size:13px}
</style>
</head>
<body>
<main>
<section class="card">
<h1>📦 COMPROBADOR TRASPASOS <span class="version-badge">V2.30</span></h1>
<div id="store-alerts" aria-live="polite"></div>

<div class="pickers">

<div class="arrow">→</div>
<div><h2>DESTINO</h2><div id="dest" class="grid"></div></div>
</div>
<div id="result"></div>
</section>
</main>
<script>
// ============================================================
// DATOS: aquí empiezas de cero. Rellena estas tres listas.
// ============================================================

// 1) Tiendas (nombre interno, sin repetir). Ej: ["TIENDA A","TIENDA B"]

// 2) Nombre que se muestra en el botón. Ej: {"TIENDA A":"01 TIENDA A"}

// 3) Cruces/tramos: [ruta, origen, destino, salida, llegada, hora_pedido]
// Ej: ["R01","TIENDA A","TIENDA B","08:00","09:00","07:45"]
const LEGS=[
// RUTA 01: 00 -> ALICANTE -> ALICANTE NORTE -> ALICANTE -> 00
["R01","ATALAYAS","ALICANTE","07:30","08:05","07:30"],["R01","ALICANTE","ALICANTE NORTE","08:05","08:45","19:30 D/A"],["R01","ALICANTE NORTE","ALICANTE","08:45","09:45","08:35"],["R01","ALICANTE","ATALAYAS","09:45","10:00","09:30"],
["R01","ATALAYAS","ALICANTE","10:50","11:15","10:50"],["R01","ALICANTE","ALICANTE NORTE","11:15","11:50","11:00"],["R01","ALICANTE NORTE","ALICANTE","11:50","12:45","11:40"],["R01","ALICANTE","ATALAYAS","12:45","13:00","12:30"],
["R01","ATALAYAS","ALICANTE","15:00","15:30","15:00"],["R01","ALICANTE","ALICANTE NORTE","15:30","16:00","13:50"],["R01","ALICANTE NORTE","ALICANTE","16:00","16:45","13:50"],["R01","ALICANTE","ATALAYAS","16:45","17:00","16:25"],
// RUTA 02: 00 -> SAN VICENTE -> MUCHAMIEL -> SAN VICENTE -> 00 (en el 2.º viaje no hay vuelta por SAN VICENTE)
["R02","ATALAYAS","SAN VICENTE","07:00","07:40","07:00"],["R02","SAN VICENTE","MUCHAMIEL","07:40","08:30","19:30 D/A"],["R02","MUCHAMIEL","SAN VICENTE","08:30","09:30","08:20"],["R02","SAN VICENTE","ATALAYAS","09:30","10:00","09:15"],
["R02","ATALAYAS","SAN VICENTE","10:30","10:30","10:30"],["R02","SAN VICENTE","MUCHAMIEL","10:30","11:30","10:25"],["R02","MUCHAMIEL","ATALAYAS","11:30","11:45","11:15"],
["R02","ATALAYAS","SAN VICENTE","14:50","15:20","14:50"],["R02","SAN VICENTE","MUCHAMIEL","15:20","16:00","13:15"],["R02","MUCHAMIEL","SAN VICENTE","16:00","16:20","13:15"],["R02","SAN VICENTE","ATALAYAS","16:20","17:00","16:15"],
// RUTA 03: 00 -> TORREVIEJA -> 00
["R03","ATALAYAS","TORREVIEJA","07:00","08:20","07:00"],["R03","TORREVIEJA","ATALAYAS","08:20","09:40","08:15"],

["R03B","HORADADA","TORREVIEJA","08:00","08:15","19:15 D/A"],["R03B","TORREVIEJA","HORADADA","08:15","09:10","08:10"],

["R04","ATALAYAS","ELCHE CARRUS","07:00","07:30","07:00"],["R04","ELCHE CARRUS","ELCHE SECTOR","07:30","08:00","19:15 D/A"],["R04","ELCHE SECTOR","ATALAYAS","08:00","09:30","19:15 D/A"],
["R04","ATALAYAS","ELCHE CARRUS","10:30","10:55","10:30"],["R04","ELCHE CARRUS","ELCHE SECTOR","10:55","11:20","10:45"],["R04","ELCHE SECTOR","ATALAYAS","11:20","12:30","11:10"],
["R04","ATALAYAS","ELCHE CARRUS","14:00","14:35","14:00"],["R04","ELCHE CARRUS","ELCHE SECTOR","14:35","15:00","14:00"],["R04","ELCHE SECTOR","ATALAYAS","15:00","16:40","14:00"],
// RUTA 04 BIS: circuito cerrado SOLO entre 11 ELCHE CARRUS y 14 ELCHE SECTOR
["R04B","ELCHE SECTOR","ELCHE CARRUS","10:15","10:30","10:15"],["R04B","ELCHE SECTOR","ELCHE CARRUS","13:00","16:00","13:00"],["R04B","ELCHE SECTOR","ELCHE CARRUS","17:30","18:00","17:30"],
["R04B","ELCHE CARRUS","ELCHE SECTOR","17:30","18:00","17:30"],
// RUTA 05: 00 -> 06 ORIHUELA -> 00
["R05","ATALAYAS","ORIHUELA","07:00","08:50","07:00"],["R05","ORIHUELA","ATALAYAS","08:50","09:30","08:40"],
["R05","ATALAYAS","ORIHUELA","10:30","11:45","10:30"],["R05","ORIHUELA","ATALAYAS","11:45","12:30","11:30"],
["R05","ATALAYAS","ORIHUELA","14:00","15:45","14:00"],["R05","ORIHUELA","ATALAYAS","15:45","16:40","13:30"],
// RUTA 06: 00 -> 15 ONDARA -> 00
["R06","ATALAYAS","ONDARA","06:00","07:20","06:00"],["R06","ONDARA","ATALAYAS","07:20","09:15","19:15 D/A"],
// RUTA 07: 00 -> 17 ALMANSA -> 08 ALBACETE -> 17 ALMANSA -> 00
["R07","ATALAYAS","ALMANSA","04:15","05:30","04:15"],["R07","ALMANSA","ALBACETE","05:30","07:15","19:15 D/A"],["R07","ALBACETE","ALMANSA","07:15","08:25","19:15 D/A"],["R07","ALMANSA","ATALAYAS","08:25","10:15","19:15 D/A"],
["R07","ATALAYAS","ALMANSA","13:20","14:20","13:20"],["R07","ALMANSA","ALBACETE","14:20","15:25","13:30"],["R07","ALBACETE","ALMANSA","15:25","16:15","13:30"],["R07","ALMANSA","ATALAYAS","16:15","17:30","13:15"],
// RUTA 08: 00 -> 30 IBI -> 07 ALCOY -> 30 IBI -> 00 (el viaje de las 10:30 no sube a ALCOY: "BAJA A IBI")
["R08","ATALAYAS","IBI","07:15","08:00","07:15"],["R08","IBI","ALCOY","08:00","08:50","19:20 D/A"],["R08","ALCOY","IBI","08:50","09:15","08:40"],["R08","IBI","ATALAYAS","09:15","09:30","09:00"],
["R08","ATALAYAS","IBI","10:30","11:25","10:30"],["R08","IBI","ATALAYAS","11:25","11:40","10:55"],
["R08","ATALAYAS","IBI","14:00","14:45","14:00"],["R08","IBI","ALCOY","14:45","15:45","13:15"],["R08","ALCOY","IBI","15:45","16:15","13:15"],["R08","IBI","ATALAYAS","16:15","16:40","16:05"],
// RUTA 09: 00 -> 24 ASPE -> 09 ELDA -> 05 VILLENA -> 00
["R09","ATALAYAS","ASPE","05:40","06:20","05:40"],["R09","ASPE","ELDA","06:20","06:50","19:30 D/A"],["R09","ELDA","VILLENA","06:50","08:15","19:15 D/A"],["R09","VILLENA","ATALAYAS","08:15","09:00","19:30 D/A"],
["R09","ATALAYAS","ASPE","10:30","11:00","10:30"],["R09","ASPE","ELDA","11:00","11:25","10:30"],["R09","ELDA","VILLENA","11:25","11:55","10:45"],["R09","VILLENA","ATALAYAS","11:55","12:10","11:30"],
["R09","ATALAYAS","ASPE","13:20","13:45","13:20"],["R09","ASPE","ELDA","13:45","14:15","13:30"],["R09","ELDA","VILLENA","14:15","15:00","13:45"],["R09","VILLENA","ATALAYAS","15:00","16:00","13:15"],
// RUTA 10: 00 -> 03 BENIDORM -> 21 CALPE (-> 15 ONDARA -> 03 BENIDORM -> 00 solo en el viaje de la tarde; las X no se cargan)
["R10","ATALAYAS","BENIDORM","05:45","06:40","05:45"],["R10","BENIDORM","CALPE","06:40","07:40","19:15 D/A"],["R10","CALPE","ATALAYAS","07:40","09:15","19:15 D/A"],
["R10","ATALAYAS","BENIDORM","10:30","11:10","10:30"],["R10","BENIDORM","CALPE","11:10","12:15","11:00"],
["R10","ATALAYAS","BENIDORM","13:20","14:05","13:20"],["R10","BENIDORM","CALPE","14:05","14:35","13:30"],["R10","CALPE","ONDARA","14:35","15:15","13:30"],["R10","ONDARA","BENIDORM","19:05","20:00","18:50"],["R10","BENIDORM","ATALAYAS","20:00","21:15","19:15"],
// RUTA 11: 28 HELLIN -> 08 ALBACETE -> 00 (solo sentido hacia 00)
["R11","HELLIN","ALBACETE","13:45","14:30","13:30"],["R11","ALBACETE","ATALAYAS","14:30","17:30","13:30"],
["R11","HELLIN","ALBACETE","17:15","18:00","17:00"],["R11","ALBACETE","ATALAYAS","18:00","10:15 D/S","19:15"],
// RUTA 12: 19 VILLARROBLEDO -> 08 ALBACETE (solo ese sentido; Albacete es la conexión con 00)
["R12","VILLARROBLEDO","ALBACETE","11:15","12:00","11:00"],["R12","VILLARROBLEDO","ALBACETE","17:15","18:00","17:00"],
// RUTA 13: 27 LA RODA -> 19 VILLARROBLEDO (solo ese sentido; enlaza únicamente con Villarrobledo)
["R13","LA RODA","VILLARROBLEDO","10:15","10:40","10:00"],["R13","LA RODA","VILLARROBLEDO","16:15","16:50","13:15"],
// RUTA 14: 18 CUENCA -> 08 ALBACETE (solo ese sentido)
["R14","CUENCA","ALBACETE","09:45","12:00","09:30"],["R14","CUENCA","ALBACETE","17:15","18:30","17:00"],
// RUTA 15: 20 TARANCON -> 08 ALBACETE (solo ese sentido)
["R15","TARANCON","ALBACETE","11:30","19:00","11:25"],["R15","TARANCON","ALBACETE","18:30","11:30 D/S","18:25"],
// RUTA 16: 26 DENIA -> 15 ONDARA (solo ese sentido)
["R16","DENIA","ONDARA","11:50","12:00","11:45"],["R16","DENIA","ONDARA","17:35","17:45","17:30"],
// RUTA 17: 25 JÁVEA <-> 15 ONDARA (circuito cerrado; la conexión con 00 es a través de Ondara)
["R17","JAVEA","ONDARA","11:15","11:35","11:00"],["R17","ONDARA","JAVEA","11:35","11:55","11:25"],
["R17","JAVEA","ONDARA","15:00","15:20","13:20"],["R17","ONDARA","JAVEA","15:20","15:40","13:20"],
["R17","JAVEA","ONDARA","17:00","17:20","16:50"],["R17","ONDARA","JAVEA","17:20","17:30","17:10"]
];

// ============================================================
// LÓGICA (no hace falta tocar)
// ============================================================
// Rutas exclusivas: sus tramos no se usan para enlazar con otras tiendas, solo entre sus dos almacenes
const EXCLUSIVE_ROUTES=new Set(["R04B"]);
const LEGS_GEN=LEGS.filter(e=>!EXCLUSIVE_ROUTES.has(e[0]));
let origin="",destination="";
function min(s){let m=String(s).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
// Norma: cualquier hora de pedido a partir de las 19:15 se muestra como 19:15 (conserva el D/A)
// Norma 2: si la salida es antes de las 08:00, la hora de corte es 19:15 del día anterior (19:15 D/A)
function pedidoText(t,dep){if(dep!==undefined&&((dep%1440)+1440)%1440<8*60)return '19:15 D/A';return String(t).replace(/(\d{1,2}):(\d{2})/,(m)=>min(m)>19*60+15?'19:15':m)}
function fmt(x){x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function edge(e, earliest){const dep=min(e[3]),arr=min(e[4]);let base=Math.floor(earliest/1440)*1440;let depAbs=base+dep;if(depAbs<earliest)depAbs+=1440;let dur=((arr-dep)+1440)%1440;let arrAbs=depAbs+dur; if(String(e[4]).includes("D/S")) arrAbs=Math.max(arrAbs,depAbs)+0; return {dep:depAbs,arr:arrAbs,edge:e}}
function findEarliest(from,to,start,firstLeg){
  const dist={}; const prev={}; const used=new Set(); STORES.forEach(s=>dist[s]=Infinity);
  dist[from]=start;
  while(true){let u=null,b=Infinity;for(const s of STORES){if(!used.has(s)&&dist[s]<b){b=dist[s];u=s}}if(u===null||u===to)break;used.add(u);
    for(const e of LEGS_GEN){if(e[1]!==u)continue; if(firstLeg && e!==firstLeg)continue; const z=edge(e,dist[u]); if(z.dep<dist[u])continue; if(z.arr<dist[e[2]]){dist[e[2]]=z.arr;prev[e[2]]={store:u,edge:e,dep:z.dep,arr:z.arr}}}
    if(firstLeg) firstLeg=null;
  }
  if(from===to)return {legs:[],arr:start}; if(!prev[to])return null;
  const legs=[];let cur=to;while(cur!==from){const p=prev[cur];if(!p)return null;legs.unshift(p);cur=p.store}return {legs,arr:dist[to]};
}
function enumerate(from,to){
  if(from===to)return {same:true,paths:[]};
  // Circuitos cerrados: entre esos dos almacenes solo valen servicios directos (sin desvíos por 00)
  const pair=(x,y)=>(from===x&&to===y)||(from===y&&to===x);
  const closedRoutes=pair('HORADADA','TORREVIEJA')?['R03B']:pair('ELCHE CARRUS','ELCHE SECTOR')?['R04','R04B']:pair('JAVEA','ONDARA')?['R17']:null;
  const closed=!!closedRoutes;
  const pool=closed?LEGS.filter(e=>closedRoutes.includes(e[0])):LEGS_GEN;
  const firsts=pool.filter(e=>e[1]===from).sort((a,b)=>min(a[3])-min(b[3]));
  const byDeparture=new Map();
  for(const f of firsts){
    const dep=min(f[3]);
    if(closed){if(f[2]!==to)continue;let arr=min(f[4]);if(arr<dep)arr+=1440;byDeparture.set(dep,{legs:[{store:from,edge:f,dep,arr}],arr});continue}
    const p=findEarliest(from,to,dep,f);
    if(!p)continue;
    const d=p.legs[0].dep, prev=byDeparture.get(d);
    if(!prev||p.legs.length<prev.legs.length)byDeparture.set(d,p);
  }
  const list=[...byDeparture.values()].sort((a,b)=>a.legs[0].dep-b.legs[0].dep);
  const arrOf=p=>p.legs[p.legs.length-1].arr;
  // Se descartan los viajes que salen antes pero llegan más tarde que otro viaje posterior (no tienen sentido)
  return {same:false,paths:list.filter(p=>!list.some(q=>q!==p&&q.legs[0].dep>=p.legs[0].dep&&arrOf(q)<arrOf(p)))};
}
function chainText(p){return p.legs.map(x=>fmt(x.dep)+(Math.floor(x.dep/1440)>0?" D/S":"")+" → "+fmt(x.arr)+(Math.floor(x.arr/1440)>0?" D/S":"")).join("  |  ")}
function routeText(p){return p.legs.map(x=>DISPLAY_NAMES[x.edge[1]]||x.edge[1]).concat(DISPLAY_NAMES[p.legs[p.legs.length-1].edge[2]]||p.legs[p.legs.length-1].edge[2]).join(" → ")}
function calc(){const out=document.querySelector('#result'); if(!origin||!destination){out.innerHTML='';return} if(origin===destination){out.innerHTML='<div class="result"><div class="big">Mismo almacén.</div></div>';return}
  const r=enumerate(origin,destination); if(!r.paths.length){out.innerHTML='<div class="result"><div class="big">🔴 Sin cadena encontrada</div><div class="incident">No hay un servicio directo o una cadena válida con los horarios cargados.</div></div>';return}
  let s='<div class="result"><div class="big">'+(DISPLAY_NAMES[origin]||origin)+' → '+(DISPLAY_NAMES[destination]||destination)+'</div><div class="steps">';
  const now=nowMin();
  const dsf=x=>{const n=Math.floor(x/1440);return n<=0?'':n===1?' D/S':' +'+n+'D'};
  const items=r.paths.map(p=>{const f=p.legs[0],l=p.legs[p.legs.length-1];return {pedido:f.edge[5],dep:f.dep,arr:l.arr,past:f.dep<now,next:false}});
  // Si ya han pasado todos los viajes de hoy, el primero de mañana se muestra en verde
  if(items.length&&items.every(x=>x.past)){const b=items[0];items.push({pedido:b.pedido,dep:b.dep+1440,arr:b.arr+1440,past:false,next:true})}
  // Primero los disponibles (el más próximo resaltado) y al final los ya pasados
  items.sort((a,b)=>(a.past-b.past)||(a.dep-b.dep));
  const firstIdx=items.findIndex(x=>!x.past);
  items.forEach((x,i)=>{const first=i===firstIdx;s+='<div class="step '+(x.past?'past':'ok')+(first?' first':'')+'"><b>Viaje '+(i+1)+'</b><span class="tag">'+(x.past?'YA PASADO':(first?'PRÓXIMO':'DISPONIBLE')+(x.next?' · MAÑANA':''))+'</span><div class="trip"><div><span class="lbl">H. PEDIDO</span><span class="val">'+pedidoText(x.pedido,x.dep)+'</span></div><div><span class="lbl">SALIDA</span><span class="val">'+fmt(x.dep)+dsf(x.dep)+'</span></div><div><span class="lbl">LLEGADA</span><span class="val">'+fmt(x.arr)+dsf(x.arr)+'</span></div></div></div>'});
  s+='</div></div>';out.innerHTML=s;
}
function buttons(id,type){const box=document.querySelector(id);if(!STORES.length){box.innerHTML='<div class="small">Sin tiendas cargadas.</div>';return}[...STORES].sort((a,b)=>(DISPLAY_NAMES[a]||a).localeCompare(DISPLAY_NAMES[b]||b,'es',{numeric:true})).forEach(s=>{const b=document.createElement('button');b.type='button';b.dataset.store=s;b.textContent=DISPLAY_NAMES[s]||s;b.onclick=()=>{if(type==='o')origin=s;else destination=s;mark();calc()};box.appendChild(b)})}
function mark(){document.querySelectorAll('#orig button').forEach(b=>b.classList.toggle('selected',b.dataset.store===origin));document.querySelectorAll('#dest button').forEach(b=>b.classList.toggle('selected',b.dataset.store===destination))}
let lastMin=-1;
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function clock(){const n=nowMin();document.querySelector('#clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n!==lastMin){lastMin=n;calc()}}
buttons('#orig','o');buttons('#dest','d');clock();setInterval(clock,1000);
</script>
