<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{width:100%;max-width:none;margin:auto;padding:10px 12px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h1{margin:0 0 5px;font-size:25px}.muted{color:#667085}.clock{font-size:18px;font-weight:700;margin:12px 0}
.pickers{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:10px;align-items:start;width:100%}.arrow{font-size:34px;font-weight:800;text-align:center;margin-top:60px}
h2{font-size:14px;margin:8px 0 9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
button{min-height:48px;border-radius:11px;border:1px solid #d0d5dd;background:#fff;font-weight:700;padding:8px;cursor:pointer}
button.selected{background:#17202a;color:#fff;border-color:#17202a}
.result{margin-top:16px;padding:15px;border-radius:14px;background:#f7f8fa}.big{font-size:25px;font-weight:800;margin-bottom:10px}
.warn{margin-top:12px;padding:12px;border-left:4px solid #f59e0b;background:#fff5df;border-radius:8px}.error{margin-top:12px;padding:12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px}
.steps{margin-top:10px}.step{padding:9px 0;border-bottom:1px solid #e7e9ec}.step:last-child{border:0}
.chain{font-weight:800;font-size:17px;line-height:1.5}.meta{font-size:14px;color:#667085;margin-top:4px}.incident{margin-top:10px;padding:10px 12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px;font-size:14px}
.small{font-size:13px;color:#667085}
@media(max-width:900px){main{padding:8px}.grid{gap:6px}}
@media(max-width:650px){.pickers{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.trip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}.trip .lbl{display:block;font-size:12px;color:#667085;font-weight:700}.trip .val{display:block;font-size:22px;font-weight:800}
.step.ok,.step.past{border-radius:10px;padding:10px 12px;margin-top:8px;border:0;border-left:5px solid}.step.ok{background:#e7f6ec;border-left-color:#16a34a}.step.past{background:#fdecea;border-left-color:#d92d20}.step.past .val{color:#b42318}.step.ok .val{color:#166534}.tag{float:right;font-size:12px;font-weight:800}.step.ok .tag{color:#166534}.step.past .tag{color:#b42318}
.step.first{background:#d1fae5;box-shadow:0 0 0 2px #16a34a}.step.first .tag{font-size:13px}
.info{margin-top:12px;padding:12px;border-left:4px solid #2563eb;background:#eff6ff;border-radius:8px}.storebox{margin-top:12px}.storebox .nm{font-weight:800;margin-bottom:4px}.storebox .ln{font-size:14px;margin-top:3px}
.warn .ln{font-size:17px;font-weight:800;color:#92400e}.warn .nm{font-size:15px}
.before{margin-top:14px;padding:12px;border-radius:12px;background:#f7f8fa}.before h3{margin:0 0 8px;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:0;padding:6px 10px;text-align:left;font-size:13px;line-height:1.3}.chip span{display:block;font-weight:600;font-size:12px;color:#667085}.chip.best{border-color:#16a34a;background:#e7f6ec}.chip.best span{color:#166534}

function min(s){let m=String(s).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
// Norma: cualquier hora de pedido a partir de las 19:15 se muestra como 19:15 (conserva el D/A)
// Norma 2: si la salida es antes de las 08:00, la hora de corte es 19:15 del día anterior (19:15 D/A)
function pedidoText(t,dep){if(/D\/A/.test(String(t))&&min(t)<=19*60+15)return String(t).replace(/(\d{1,2}):(\d{2})/,m=>fmt(min(m)));if(dep!==undefined&&((dep%1440)+1440)%1440<8*60)return '19:15 D/A';return String(t).replace(/(\d{1,2}):(\d{2})/,(m)=>min(m)>19*60+15?'19:15':m)}
function fmt(x){x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function edge(e, earliest){const dep=min(e[3]),arr=min(e[4]);let base=Math.floor(earliest/1440)*1440;let depAbs=base+dep;if(depAbs<earliest)depAbs+=1440;let dur=((arr-dep)+1440)%1440;let arrAbs=depAbs+dur; if(String(e[4]).includes("D/S")) arrAbs=Math.max(arrAbs,depAbs)+0; return {dep:depAbs,arr:arrAbs,edge:e}}
function findEarliest(from,to,start,firstLeg){
  const dist={}; const prev={}; const used=new Set(); STORES.forEach(s=>dist[s]=Infinity);
  dist[from]=start;
  while(true){let u=null,b=Infinity;for(const s of STORES){if(!used.has(s)&&dist[s]<b){b=dist[s];u=s}}if(u===null||u===to)break;used.add(u);
    for(const e of LEGS_GEN){if(e[1]!==u)continue; if(firstLeg && e!==firstLeg)continue; const z=edge(e,dist[u]); if(z.dep<dist[u])continue; if(z.arr<dist[e[2]]){dist[e[2]]=z.arr;prev[e[2]]={store:u,edge:e,dep:z.dep,arr:z.arr}}}
    if(firstLeg) firstLeg=null;
  }
  if(from===to)return {legs:[],arr:start}; if(!prev[to])return null;
  const legs=[];let cur=to;while(cur!==from){const p=prev[cur];if(!p)return null;legs.unshift(p);cur=p.store}return {legs,arr:dist[to]};
}
function enumerate(from,to){
  if(from===to)return {same:true,paths:[]};
  // Circuitos cerrados: entre esos dos almacenes solo valen servicios directos (sin desvíos por 00)
  const pair=(x,y)=>(from===x&&to===y)||(from===y&&to===x);
  const closedRoutes=pair('HORADADA','TORREVIEJA')?['R03B']:pair('ELCHE CARRUS','ELCHE SECTOR')?['R04','R04B']:pair('JAVEA','ONDARA')?['R17']:null;
  const closed=!!closedRoutes;
  const pool=closed?LEGS.filter(e=>closedRoutes.includes(e[0])):LEGS_GEN;
  const firsts=pool.filter(e=>e[1]===from).sort((a,b)=>min(a[3])-min(b[3]));
  const byDeparture=new Map();
  for(const f of firsts){
    const dep=min(f[3]);
    if(closed){if(f[2]!==to)continue;let arr=min(f[4]);if(arr<dep)arr+=1440;byDeparture.set(dep,{legs:[{store:from,edge:f,dep,arr}],arr});continue}
    const p=findEarliest(from,to,dep,f);
    if(!p)continue;
    const d=p.legs[0].dep, prev=byDeparture.get(d);
    if(!prev||p.legs.length<prev.legs.length)byDeparture.set(d,p);
  }
  const list=[...byDeparture.values()].sort((a,b)=>a.legs[0].dep-b.legs[0].dep);
  const arrOf=p=>p.legs[p.legs.length-1].arr;
  // Se descartan los viajes que salen antes pero llegan más tarde que otro viaje posterior (no tienen sentido)
  return {same:false,paths:list.filter(p=>!list.some(q=>q!==p&&q.legs[0].dep>=p.legs[0].dep&&arrOf(q)<arrOf(p)))};
}
function chainText(p){return p.legs.map(x=>fmt(x.dep)+(Math.floor(x.dep/1440)>0?" D/S":"")+" → "+fmt(x.arr)+(Math.floor(x.arr/1440)>0?" D/S":"")).join("  |  ")}
function routeText(p){return p.legs.map(x=>DISPLAY_NAMES[x.edge[1]]||x.edge[1]).concat(DISPLAY_NAMES[p.legs[p.legs.length-1].edge[2]]||p.legs[p.legs.length-1].edge[2]).join(" → ")}
function calc(){renderBefore();const out=document.querySelector('#result'); if(!origin||!destination){out.innerHTML='';return} if(origin===destination){out.innerHTML='<div class="result"><div class="big">Mismo almacén.</div></div>';return}
  const r=enumerate(origin,destination); if(!r.paths.length){out.innerHTML='<div class="result"><div class="big">🔴 Sin cadena encontrada</div><div class="incident">No hay un servicio directo o una cadena válida con los horarios cargados.</div></div>';return}
  let s='<div class="result"><div class="big">'+(DISPLAY_NAMES[origin]||origin)+' → '+(DISPLAY_NAMES[destination]||destination)+'</div><div class="steps">';
  const now=nowMin();
  const dsf=x=>{const n=Math.floor(x/1440);return n<=0?'':n===1?' D/S':' +'+n+'D'};
  const items=r.paths.map(p=>{const f=p.legs[0],l=p.legs[p.legs.length-1];return {pedido:f.edge[5],dep:f.dep,arr:l.arr,past:f.dep<now,next:false}});
  // Si ya han pasado todos los viajes de hoy, el primero de mañana se muestra en verde
  if(items.length&&items.every(x=>x.past)){const b=items[0];items.push({pedido:b.pedido,dep:b.dep+1440,arr:b.arr+1440,past:false,next:true})}
  // Primero los disponibles (el más próximo resaltado) y al final los ya pasados
  items.sort((a,b)=>(a.past-b.past)||(a.dep-b.dep));
  const firstIdx=items.findIndex(x=>!x.past);
  items.forEach((x,i)=>{const first=i===firstIdx;s+='<div class="step '+(x.past?'past':'ok')+(first?' first':'')+'"><b>Viaje '+(i+1)+'</b><span class="tag">'+(x.past?'YA PASADO':(first?'PRÓXIMO':'DISPONIBLE')+(x.next?' · MAÑANA':''))+'</span><div class="trip"><div><span class="lbl">H. PEDIDO</span><span class="val">'+pedidoText(x.pedido,x.dep)+'</span></div><div><span class="lbl">SALIDA</span><span class="val">'+fmt(x.dep)+dsf(x.dep)+'</span></div><div><span class="lbl">LLEGADA</span><span class="val">'+fmt(x.arr)+dsf(x.arr)+'</span></div></div></div>'});
  s+='</div></div>';out.innerHTML=s;
}
function buttons(id,type){const box=document.querySelector(id);if(!STORES.length){box.innerHTML='<div class="small">Sin tiendas cargadas.</div>';return}[...STORES].sort((a,b)=>(DISPLAY_NAMES[a]||a).localeCompare(DISPLAY_NAMES[b]||b,'es',{numeric:true})).forEach(s=>{const b=document.createElement('button');b.type='button';b.dataset.store=s;b.textContent=DISPLAY_NAMES[s]||s;b.onclick=()=>{if(type==='o')origin=s;else destination=s;mark();calc();renderStoreAlerts()};box.appendChild(b)})}
function mark(){document.querySelectorAll('#orig button').forEach(b=>b.classList.toggle('selected',b.dataset.store===origin));document.querySelectorAll('#dest button').forEach(b=>b.classList.toggle('selected',b.dataset.store===destination))}
let lastMin=-1;
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function clock(){const n=nowMin();document.querySelector('#clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n!==lastMin){lastMin=n;calc();renderStoreAlerts()}}
// Almacenes que van ANTES del destino en su ruta (cadenas de cada ruta: viaje a viaje)
const CHAINS=(()=>{const out={},cur={};LEGS.forEach(e=>{const r=e[0];let c=cur[r];if(!c||c[c.length-1]!==e[1]){c=cur[r]=[e[1]];(out[r]=out[r]||[]).push(c)}c.push(e[2]);if(e[2]===c[0])cur[r]=null});return out})();
function beforeOf(D){const res={};Object.keys(CHAINS).forEach(r=>CHAINS[r].forEach(c=>c.forEach((st,i)=>{if(st===D)c.slice(0,i).forEach(x=>{if(x!==D){(res[x]=res[x]||new Set()).add(r)}})})));return res}
function routeLabel(r){return r.replace(/^R(\d+)B$/,'R$1 BIS')}
function dayTag(x){const n=Math.floor(x/1440);return n<=0?'':n===1?' D/S':' +'+n+'D'}
function renderBefore(){const box=document.querySelector('#before');if(!destination){box.innerHTML='';return}
  const m=beforeOf(destination),now=nowMin(),items=[];
  Object.keys(m).forEach(st=>{const ps=enumerate(st,destination).paths;let arr=null;
    if(ps.length){let p=ps.find(q=>q.legs[0].dep>=now),add=0;if(!p){p=ps[0];add=1440}arr=p.legs[p.legs.length-1].arr+add}
    items.push({st,rs:[...m[st]].map(routeLabel).join(' · '),arr})});
  if(!items.length){box.innerHTML='';return}
  items.sort((a,b)=>((a.arr===null)-(b.arr===null))||(a.arr-b.arr));
  box.innerHTML='<div class="before"><h3>Antes de '+(DISPLAY_NAMES[destination]||destination)+' en su ruta · el que llega antes, primero</h3><div class="chips">'+items.map((x,i)=>'<button type="button" class="chip'+(i===0&&x.arr!==null?' best':'')+'" data-store="'+x.st+'">'+(DISPLAY_NAMES[x.st]||x.st)+'<span>'+(x.arr===null?'sin enlace directo':'llega '+fmt(x.arr)+dayTag(x.arr))+' · '+x.rs+'</span></button>').join('')+'</div></div>';
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{origin=b.dataset.store;mark();calc();renderStoreAlerts()})}
// Agrupa los repartos que tienen EXACTAMENTE el mismo horario en una sola línea ("Banyeres / Benejama: ...") y ordena alfabéticamente
function groupRepartos(list){const cmp=(a,b)=>a.localeCompare(b,'es',{sensitivity:'base'});const m=new Map();
  list.forEach(r=>{const k=r.indexOf(': ');if(k<0){m.set('\u0000'+r,{n:[r],t:null});return}const nm=r.slice(0,k),t=r.slice(k+2);if(!m.has(t))m.set(t,{n:[],t});m.get(t).n.push(nm)});
  return [...m.values()].map(g=>{g.n.sort(cmp);return g.t===null?g.n[0]:g.n.join(' / ')+': '+g.t}).sort(cmp)}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderStoreAlerts(){
  const sel=[...new Set([origin,destination].filter(Boolean))],today=todayStr();let h='';
  sel.forEach(st=>{
    const day=DAY_ALERTS.filter(a=>a.fecha===today&&(!a.hasta||nowMin()<min(a.hasta))&&a.tiendas.includes(st));
    day.forEach(a=>{h+='<div class="alerta" role="alert"><div class="tt">🚫 '+a.titulo+' '+a.fecha.split('-').reverse().join('/')+'</div>'+a.lineas.map(l=>'<div class="ln">'+l+'</div>').join('')+'</div>'});
    const i=STORE_INFO[st];if(!i)return;
    const av=day.length?[]:(i.avisos||[]);
    const rpAll=i.repartos||[];const rp=[...groupRepartos(rpAll.filter(r=>!r.startsWith('('))),...rpAll.filter(r=>r.startsWith('('))];
    if(!av.length&&!rp.length)return;
    h+='<div class="storebox"><div class="'+(av.length?'warn':'info')+'"><div class="nm">'+(DISPLAY_NAMES[st]||st)+'</div>'+av.map(a=>'<div class="ln">⚠️ '+a+'</div>').join('')+rp.map(r=>r.startsWith('(')?'<div class="ln small">'+r+'</div>':'<div class="ln">🚚 '+r+'</div>').join('')+'</div></div>'});
  document.querySelector('#store-alerts').innerHTML=h}
buttons('#orig','o');buttons('#dest','d');clock();setInterval(clock,1000);renderStoreAlerts();
</script>
</body></html>
