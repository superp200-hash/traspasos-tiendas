</div>
<main>
<section class="card">

<script>
const STORES=["ATALAYAS", "ALICANTE", "BENIDORM", "TORREVIEJA", "VILLENA", "ORIHUELA", "ALCOY", "ALBACETE", "ELDA", "MUCHAMIEL", "ELCHE CARRUS", "SAN VICENTE", "ELCHE SECTOR", "ONDARA", "ALICANTE NORTE", "ALMANSA", "CUENCA", "VILLARROBLEDO", "TARANCON", "CALPE", "HORADADA", "ASPE", "JAVEA", "DENIA", "LA RODA", "HELLIN", "IBI"], LEGS=[["R01","ATALAYAS","ALICANTE","7:30","8:05","19:30 D/A"],["R01","ALICANTE","ALICANTE NORTE","8:05","8:45","19:30 D/A"],["R01","ALICANTE NORTE","ALICANTE","8:45","9:45","9:30"],["R01","ATALAYAS","ALICANTE","10:50","11:20","11:00"],["R01","ALICANTE","ALICANTE NORTE","11:20","11:50","11:40"],["R01","ALICANTE NORTE","ALICANTE","11:50","12:45","12:30"],["R01","ATALAYAS","ALICANTE","15:00","15:30","13:50"],["R01","ALICANTE","ALICANTE NORTE","15:30","16:00","13:50"],["R01","ALICANTE NORTE","ALICANTE","16:00","16:45","16:25"],["R02","ATALAYAS","SAN VICENTE","7:00","7:40","19:30 D/A"],["R02","SAN VICENTE","MUCHAMIEL","7:40","8:30","19:30 D/A"],["R02","MUCHAMIEL","SAN VICENTE","8:30","9:30","9:15"],["R02","ATALAYAS","SAN VICENTE","10:30","10:50","10:35"],["R02","SAN VICENTE","MUCHAMIEL","10:50","11:30","11:15"],["R02","ATALAYAS","SAN VICENTE","14:50","15:20","13:15"],["R02","SAN VICENTE","MUCHAMIEL","15:20","16:00","13:15"],["R02","MUCHAMIEL","SAN VICENTE","16:00","16:30","16:15"],["R03","ATALAYAS","TORREVIEJA","7:00","8:30","19:20 D/A"],["R03","ATALAYAS","TORREVIEJA","10:30","11:40","11:30"],["R03","ATALAYAS","TORREVIEJA","14:00","15:15","13:15"],["R03 BIS","HORADADA","TORREVIEJA","8:00","8:25","8:10"],["R03 BIS","HORADADA","TORREVIEJA","10:30","11:00","10:50"],["R03 BIS","HORADADA","TORREVIEJA","15:00","15:30","13:15"],["R04","ATALAYAS","ELCHE CARRUS","7:00","7:30","19:15 D/A"],["R04","ELCHE CARRUS","ELCHE SECTOR","7:30","8:00","19:15 D/A"],["R04","ATALAYAS","ELCHE CARRUS","10:30","10:55","10:45"],["R04","ELCHE CARRUS","ELCHE SECTOR","10:55","11:20","11:10"],["R04","ATALAYAS","ELCHE CARRUS","14:00","14:35","14:00"],["R04","ELCHE CARRUS","ELCHE SECTOR","14:35","15:00","14:00"],["R05","ATALAYAS","ORIHUELA","7:00","8:50","8:40"],["R05","ATALAYAS","ORIHUELA","10:30","11:45","11:30"],["R05","ATALAYAS","ORIHUELA","14:00","15:45","13:30"],["R07","ATALAYAS","ALMANSA","13:20","14:20","13:30"],["R07","ALMANSA","ALBACETE","14:20","15:25","13:30"],["R07","ALBACETE","ALMANSA","15:25","16:15","16:00"],["R08","ATALAYAS","IBI","7:15","8:00","19:20 D/A"],["R08","IBI","ALCOY","8:00","8:50","8:40"],["R08","ALCOY","IBI","8:50","9:15","9:00"],["R08","ATALAYAS","IBI","10:30","11:25","10:55"],["R08","ATALAYAS","IBI","14:00","14:45","13:15"],["R08","IBI","ALCOY","14:45","15:45","13:15"],["R08","ALCOY","IBI","15:45","16:15","16:05"],["R09","ATALAYAS","ASPE","5:40","6:20","19:30 D/A"],["R09","ASPE","ELDA","6:20","6:50","19:15 D/A"],["R09","ELDA","VILLENA","6:50","8:15","19:30 D/A"],["R09","ATALAYAS","ASPE","10:30","11:00","10:30"],["R09","ASPE","ELDA","11:00","11:25","10:45"],["R09","ELDA","VILLENA","11:25","11:55","11:30"],["R09","ATALAYAS","ASPE","13:20","13:45","13:30"],["R09","ASPE","ELDA","13:45","14:15","13:45"],["R09","ELDA","VILLENA","14:15","15:00","13:15"],["R10","ATALAYAS","BENIDORM","5:45","6:40","19:15 D/A"],["R10","BENIDORM","CALPE","6:40","7:40","19:15 D/A"],["R10","ATALAYAS","BENIDORM","10:30","11:10","11:00"],["R10","BENIDORM","CALPE","11:10","12:15","12:00"],["R10","ATALAYAS","BENIDORM","13:20","14:05","13:30"],["R10","BENIDORM","CALPE","14:05","14:35","13:30"],["R10","CALPE","ONDARA","14:35","15:15","13:30"],["R10","ONDARA","ONDARA","15:15","19:05","18:50"],["R10","ONDARA","BENIDORM","19:05","20:00","19:15"],["R11","ATALAYAS","ALMANSA","4:15","5:30","19:15 D/A"],["R11","ALMANSA","ALBACETE","5:30","7:15","19:15 D/A"],["R11","ALBACETE","ALMANSA","7:15","8:25","19:15 D/A"],["R06","ATALAYAS","ONDARA","6:00","7:20","19:15 D/A"]], TESTS=[["ALICANTE", "ALICANTE NORTE"], ["ALICANTE", "ORIHUELA"], ["IBI", "ALCOY"], ["ELCHE CARRUS", "ORIHUELA"]];
let origin="",destination="";
/* Todas las rutas cargadas de la versión de trabajo. */
const DISPLAY_NAMES={"ATALAYAS": "00 ATALAYAS", "ALICANTE": "01 ALICANTE", "BENIDORM": "03 BENIDORM", "TORREVIEJA": "04 TORREVIEJA", "VILLENA": "05 VILLENA", "ORIHUELA": "06 ORIHUELA", "ALCOY": "07 ALCOY", "ALBACETE": "08 ALBACETE", "ELDA": "09 ELDA", "MUCHAMIEL": "10 MUCHAMIEL", "ELCHE CARRUS": "11 ELCHE CARRUS", "SAN VICENTE": "12 SAN VICENTE", "ELCHE SECTOR": "14 ELCHE SECTOR", "ONDARA": "15 ONDARA", "ALICANTE NORTE": "16 ALICANTE NORTE", "ALMANSA": "17 ALMANSA", "CUENCA": "18 CUENCA", "VILLARROBLEDO": "19 VILLARROBLEDO", "TARANCON": "20 TARANCON", "CALPE": "21 CALPE", "HORADADA": "22 HORADADA", "ASPE": "24 ASPE", "JAVEA": "25 JAVEA", "DENIA": "26 DENIA", "LA RODA": "27 LA RODA", "HELLIN": "28 HELLIN", "IBI": "30 IBI"};
function min(s){let m=String(s).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
function displayCut(v){
  return String(v||"").replace(/\s+D\/A$/,"");
}
function fmt(x){x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function now(){let d=new Date();return d.getHours()*60+d.getMinutes()}
function clock(){let d=new Date();document.querySelector("#clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function buttons(id,type){let box=document.querySelector(id);STORES.forEach(s=>{let b=document.createElement("button");b.type="button";b.dataset.store=s;b.textContent=DISPLAY_NAMES[s]||s;b.onclick=()=>{if(type==="o")origin=s;else destination=s;mark();if(origin&&destination)calc()};box.appendChild(b)})}
function mark(){document.querySelectorAll("#orig button").forEach(b=>b.classList.toggle("selected",b.dataset.store===origin));document.querySelectorAll("#dest button").forEach(b=>b.classList.toggle("selected",b.dataset.store===destination))}

function edgeAt(e, earliest, enforceCut=true){
  const dep=min(e[3]), arr=min(e[4]);
  if(dep===null || arr===null) return null;

  const cutText=e[5] ? String(e[5]) : "";
  const cut=cutText ? min(cutText) : null;
  const isPrevDay=cutText.includes("D/A");

  for(let day=0;day<=4;day++){
    const depAbs=day*1440+dep;
    let arrAbs=day*1440+arr;
    if(arr<dep) arrAbs+=1440;

    if(depAbs<earliest) continue;

    // H.PEDIDO is the deadline for the day on which the material is
    // prepared. For D/A routes, the deadline is the previous calendar day
    // relative to the departure.
    if(enforceCut && cut!==null){
      const requestDay=(isPrevDay ? day-1 : day)*1440;
      const requestAbs=requestDay+cut;
      if(earliest>requestAbs) continue;
    }

    return {
      route:e[0], from:e[1], to:e[2],
      dep:depAbs, arr:arrAbs, cut:e[5] || ""
    };
  }
  return null;
}

function findPath(from,to,start){
  if(from===to)return {same:true};

  // Dijkstra sobre los horarios: en cada enlace se toma la primera salida
  // disponible después de la llegada al nodo. El límite H.PEDIDO se aplica
  // únicamente al primer tramo, porque la consulta se hace una sola vez.
  const dist={}, prev={}, firstHop={};
  STORES.forEach(s=>dist[s]=Infinity);
  dist[from]=start;

  const used=new Set();

  while(true){
    let u=null,best=Infinity;
    for(const s of STORES){
      if(!used.has(s) && dist[s]<best){best=dist[s];u=s;}
    }
    if(u===null) break;
    used.add(u);
    if(u===to) break;

    for(const e of LEGS){
      if(e[1]!==u) continue;

      const isFirst=(u===from);
      const edge=edgeAt(e,dist[u],isFirst);
      if(!edge) continue;

      if(edge.arr<dist[e[2]]){
        dist[e[2]]=edge.arr;
        prev[e[2]]={store:u,edge};
      }
    }
  }

  if(!prev[to]) return null;

  const legs=[];
  let cur=to;
  while(cur!==from){
    const p=prev[cur];
    if(!p)return null;
    legs.unshift(p.edge);
    cur=p.store;
  }

  return {
    legs,
    kind:legs.some(e=>e.from==="ATALAYAS"||e.to==="ATALAYAS")?"via":"direct"
  };
}
function dayLabel(abs){
  const d=Math.floor(abs/1440);
  if(d===0)return 'hoy';
  if(d===1)return 'mañana';
  return 'día siguiente';
}

function calc(){
  const out=document.querySelector("#result");
  const n=now();

  if(origin===destination){
    out.innerHTML='<div class="result"><div class="big">Mismo almacén.</div></div>';
    return;
  }

  const p=findPath(origin,destination,n);

  if(!p){
    out.innerHTML=
      '<div class="result">'+
      '<div class="big">🔴 No hay conexión disponible.</div>'+
      '<div>No hay una salida disponible desde la hora actual con su hora límite de pedido.</div>'+
      '<div class="warn">⚠️ <b>No olvides terminar el traspaso interno.</b></div>'+
      '</div>';
    return;
  }

  const last=p.legs[p.legs.length-1];

  let s=
    '<div class="result">'+
    '<div class="big">🟢 Llega '+dayLabel(last.arr)+' a las '+fmt(last.arr)+'</div>'+
    '<b>'+origin+' → '+destination+'</b>'+
    '<div class="steps">';

  p.legs.forEach(e=>{
    s+=
      '<div class="step">'+
      '<b>'+e.from+' → '+e.to+'</b><br>'+
      e.route+
      (e.cut ? ' · 📦 H. PEDIDO '+String(e.cut).replace(/\s+D\/A$/,'') : ' · 📦 H. PEDIDO no indicado')+
      ' · 🕐 llega '+fmt(e.arr)+(String(e.arr).includes('D/S')?' D/S':'')+
      '</div>';
  });

  s+='</div>';

  if(p.kind==="via"){
    s+='';
  }

  s+='<div class="muted" style="margin-top:9px">📦 La hora mostrada es la hora límite de pedido. En 00 ATALAYAS el corte es la referencia; material de transelevador: pedir 30 min antes.</div><div class="warn">⚠️ <b>No olvides terminar el traspaso interno.</b></div></div>';
  out.innerHTML=s;
}

buttons("#orig","o");buttons("#dest","d");
document.querySelector("#tests").innerHTML="";
TESTS.forEach(t=>{let b=document.createElement("button");b.className="test";b.innerHTML="<b>"+t[0]+" → "+t[1]+"</b><br><span class='muted'>prueba</span>";b.onclick=()=>{origin=t[0];destination=t[1];mark();calc()};document.querySelector("#tests").appendChild(b)});
clock();setInterval(clock,1000);
</script></body></html>
